<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>القارئ | الملكوت المكتوب</title><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="nav"><a class="brand" href="index.html">✦ الملكوت المكتوب</a><nav><a href="index.html">الرئيسية</a><a id="back" href="index.html">فهرس الرواية</a></nav></header><main class="reader"><p class="eyebrow" id="novel"></p><h1 id="chapter"></h1><div class="reader-tools"><button id="bigger">+ تكبير</button><button id="smaller">− تصغير</button><button id="theme">◐ تغيير المظهر</button><button id="resume">↪ أكمل القراءة</button><button id="bookmark">🔖 احفظ علامة</button><button id="gotoBookmark">اذهب للعلامة</button></div><div class="reader-tools"><button id="listen">▶ استمع</button><label>السرعة <select id="speed"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label><button id="pdf">⬇ PDF / طباعة</button><button id="epub">⬇ EPUB</button></div><div class="progress-row"><label for="progress">تقدم القراءة</label><progress id="progress" value="0" max="100"></progress><span id="percent">0%</span></div><div class="story" id="story">جاري تحميل الفصل…</div><p class="notice" id="hint"></p><div class="reader-tools"><a class="cta" id="prev">الفصل السابق</a><a class="cta" id="next">الفصل التالي</a></div><section class="community"><h2>آراء القراء</h2><p id="communityStatus" class="notice"></p><div id="ratingSummary"></div><form id="ratingForm" class="guest-form"><h3>قيّم الفصل</h3><input id="ratingName" placeholder="اسمك" maxlength="50" required minlength="2"><select id="stars" aria-label="التقييم"><option value="5">★★★★★ — 5</option><option value="4">★★★★ — 4</option><option value="3">★★★ — 3</option><option value="2">★★ — 2</option><option value="1">★ — 1</option></select><button type="submit">إرسال التقييم</button></form><form id="commentForm" class="guest-form"><h3>اكتب تعليقًا</h3><input id="guestName" placeholder="اسمك" maxlength="50" required minlength="2"><textarea id="guestComment" rows="4" placeholder="ما رأيك في الفصل؟" maxlength="1500" required minlength="3"></textarea><button type="submit">نشر التعليق</button></form><div id="comments"></div><p class="notice">التعليقات عامة بعد تفعيل الخدمة. تجنّب نشر بيانات شخصية.</p></section></main><footer>حينما يتحول الملكوت لكلام مكتوب</footer><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="config.js"></script><script src="reader.js"></script></body></html>
