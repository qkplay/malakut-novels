<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قارئ الملكوت</title><link href="https://fonts.googleapis.com/css2?family=Amiri&family=IBM+Plex+Sans+Arabic&family=Noto+Naskh+Arabic&display=swap" rel="stylesheet"><style>
:root{--bg:#f4ecd9;--ink:#27221b;--bar:#142139;--gold:#e8bd7e}*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:var(--bg);color:var(--ink);font-family:Amiri,serif}body.dark{--bg:#15191e;--ink:#eee6d9}body.white{--bg:#fff;--ink:#111}#toolbar{position:fixed;top:0;right:0;left:0;z-index:10;background:var(--bar);color:#fff;box-shadow:0 2px 14px #0003;font:14px 'IBM Plex Sans Arabic',sans-serif;padding:9px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}button,select{border:1px solid #637188;border-radius:9px;background:#253754;color:white;padding:8px;cursor:pointer;font:inherit}button:hover{background:#3b5071}#toggle{position:fixed;z-index:20;bottom:16px;left:16px;border-radius:40px;background:#283d5e}body.clean #toolbar{display:none}main{max-width:820px;margin:100px auto 100px;padding:15px 25px;font-size:25px;line-height:2.1;overflow-wrap:anywhere}main img{max-width:100%;height:auto}main p{text-align:justify}main h1,main h2,main h3{text-align:center;line-height:1.6}#status{position:fixed;bottom:0;right:0;left:0;background:var(--bar);color:#fff;font:12px 'IBM Plex Sans Arabic',sans-serif;padding:5px 12px;text-align:center}body.clean #status{display:none}#error{color:#b32a2a} @media print{#toolbar,#toggle,#status{display:none!important}main{margin:0;max-width:none;color:#000;font-size:15pt}body{background:white}}@media(max-width:650px){main{margin-top:175px;padding:12px 18px}#toolbar{font-size:12px}} </style></head><body><nav id="toolbar" aria-label="أدوات القراءة"><a href="./index.html" style="color:#e8bd7e">المكتبة</a><button id="play">▶ تمرير</button><label>السرعة <input id="speed" type="range" min="5" max="120" value="30"><span id="speedText">30</span></label><button id="smaller">أ−</button><button id="larger">أ+</button><select id="font" aria-label="نوع الخط"><option value="Amiri">أميري</option><option value="'Noto Naskh Arabic'">نسخ</option><option value="'IBM Plex Sans Arabic'">بلكس</option></select><select id="theme" aria-label="المظهر"><option value="paper">ورقي</option><option value="dark">ليلي</option><option value="white">أبيض</option></select><button id="save">🔖 حفظ</button><button id="resume">↩ العودة للعلامة</button><button id="print">PDF / طباعة</button><button id="clean">قراءة نقية</button></nav><button id="toggle" aria-label="إظهار وإخفاء أدوات القراءة">☰</button><main id="content" aria-live="polite"><p>جارٍ تحميل الرواية...</p></main><div id="status"></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id), params=new URLSearchParams(location.search),file=params.get('file'),root=$('content'),settingsKey='malakut:settings',saved=JSON.parse(localStorage.getItem(settingsKey)||'{}');let running=false,last=0,frame=0,words=0;const key='malakut:progress:'+file;function progress(){const h=document.documentElement;return Math.max(0,Math.min(1,scrollY/Math.max(1,h.scrollHeight-innerHeight)))}function mark(){localStorage.setItem(key,JSON.stringify({ratio:progress(),at:Date.now()}))}function restore(){try{const p=JSON.parse(localStorage.getItem(key)||'null');if(p)scrollTo(0,p.ratio*Math.max(0,document.documentElement.scrollHeight-innerHeight))}catch{}}function update(){const remaining=Math.round(words*(1-progress())/200);$('status').textContent=`${Math.round(progress()*100)}% من الفصل • نحو ${remaining} دقيقة متبقية (تقديريًا)`}function apply(){document.body.classList.toggle('dark',$('theme').value==='dark');document.body.classList.toggle('white',$('theme').value==='white');root.style.fontFamily=$('font').value+',serif';root.style.fontSize=(saved.size||25)+'px';localStorage.setItem(settingsKey,JSON.stringify({size:saved.size,font:$('font').value,theme:$('theme').value,speed:+$('speed').value}));$('speedText').textContent=$('speed').value}function stop() {running=false;cancelAnimationFrame(frame);$('play').textContent='▶ تمرير'}function tick(t){if(!running)return;if(last)scrollBy(0,(+ $('speed').value)*(t-last)/1000);last=t;update();if(scrollY+innerHeight>=document.documentElement.scrollHeight-2){stop();return}frame=requestAnimationFrame(tick)}$('play').onclick=()=>{if(running){stop();return}running=true;last=0;$('play').textContent='⏸ إيقاف';frame=requestAnimationFrame(tick)};$('speed').value=saved.speed||30;$('font').value=saved.font||'Amiri';$('theme').value=saved.theme||'paper';$('speed').oninput=$('font').onchange=$('theme').onchange=apply;$('larger').onclick=()=>{saved.size=Math.min(44,(saved.size||25)+2);apply()};$('smaller').onclick=()=>{saved.size=Math.max(14,(saved.size||25)-2);apply()};$('save').onclick=()=>{mark();alert('تم حفظ موضع القراءة')};$('resume').onclick=restore;$('print').onclick=()=>window.print();$('clean').onclick=()=>document.body.classList.add('clean');$('toggle').onclick=()=>document.body.classList.toggle('clean');addEventListener('scroll',()=>{update();clearTimeout(window._saveTimer);window._saveTimer=setTimeout(mark,1000)},{passive:true});addEventListener('pagehide',mark);addEventListener('wheel',()=>{if(running)stop()},{passive:true});addEventListener('touchstart',()=>{if(running)stop()},{passive:true});addEventListener('keydown',e=>{if(running&&['ArrowDown','ArrowUp','PageDown','PageUp',' '].includes(e.key))stop()});
async function load(){if(!file||/^(?:[a-z]+:|\/|\\)/i.test(file)||file.includes('..')||!file.toLowerCase().endsWith('.html')){root.textContent='رابط الرواية غير صالح';return}try{const response=await fetch(new URL(file,location.href));if(!response.ok)throw Error('تعذر العثور على ملف الرواية');const html=await response.text(),doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,iframe,object,embed,form,nav,footer,header,button,input').forEach(x=>x.remove());let source=doc.querySelector('article, .novel-content, .chapter-content, .story-content, #content, main')||doc.body;const clone=source.cloneNode(true);clone.querySelectorAll('[onclick],[onload],[onerror]').forEach(x=>{x.removeAttribute('onclick');x.removeAttribute('onload');x.removeAttribute('onerror')});clone.querySelectorAll('*').forEach(x=>{for(const a of [...x.attributes])if(/^on/i.test(a.name)||a.name==='style'||a.name==='srcdoc')x.removeAttribute(a.name);if(x.hasAttribute('href')){try{const u=new URL(x.getAttribute('href'),response.url);if(!['http:','https:','mailto:'].includes(u.protocol))x.removeAttribute('href');else x.setAttribute('href',u.href)}catch{x.removeAttribute('href')}}if(x.hasAttribute('src')){try{const u=new URL(x.getAttribute('src'),response.url);if(!['http:','https:'].includes(u.protocol))x.removeAttribute('src');else x.setAttribute('src',u.href)}catch{x.removeAttribute('src')}}});root.replaceChildren(...clone.childNodes);words=(root.textContent.match(/\S+/g)||[]).length;document.title=(doc.title||'رواية')+' | قارئ الملكوت';setTimeout(()=>{restore();update()},350)}catch(e){root.textContent='تعذر تحميل الرواية: '+e.message}}apply();load();})();
</script></body></html>
